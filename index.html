const fmt=n=>new Intl.NumberFormat('es-CO',{maximumFractionDigits:0}).format(Number(n)||0);

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function plusDays(iso,n){const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
const shortDate=x=>x?new Date(x+'T12:00:00Z').toLocaleDateString('es-CO',{timeZone:'UTC',day:'2-digit',month:'short'}):'—';

 }

 if(i%2===0){const sku=skuPick(),qty=Math.min(roll(24,64),stock(sku,'M')-5);if(qty>0){const id=gen('TRA');const t={id,date,origin:'M',destination:'P',items:[{sku,qty}],status:'EN TRÁNSITO',transport:i%4===0?'FLOTA':'TERCERO',carrier:i%4===0?'Camión propio':'Transportador externo',transportDeliveredDate:null,tripId:null,sentDate:date,receivedDate:null};data.transfers.push(t);add(date,'TRASLADO_SALIDA',sku,[{loc:'M',delta:-qty},{loc:'T',delta:qty}],id,'Despacho hacia María Paz','Planta Mosquera');if(i<13)pending.push({id,day:i+1});}}
 // Viaje de camión uno cada dos días, con pedidos asociados y gastos.

 // Pedidos despachados: descontados exactamente una vez del stock.

function balanceFor(data,sku,loc,date){const p=data.products.find(p=>p.sku===sku);if(!p)return 0;let count=Number(p.opening?.[loc]||0);for(const e of data.events){if(e.sku!==sku||(date&&e.date>date))continue;for(const leg of e.legs)if(leg.loc===loc)count+=Number(leg.delta)}return count}
function balancesAt(data,date){const out={};for(const p of data.products)out[p.sku]={M:p.opening.M||0,P:p.opening.P||0,T:p.opening.T||0};for(const e of data.events){if(date&&e.date>date)continue;if(!out[e.sku])continue;for(const x of e.legs)out[e.sku][x.loc]=(out[e.sku][x.loc]||0)+x.delta}return out}
function reservedFor(data,sku,loc,ignoreTransfer){let count=0;for(const o of data.orders){if(o.origin!==loc||o.status!=='RESERVADO')continue;for(const it of o.items)if(it.sku===sku)count+=it.qty}for(const t of data.transfers){if(t.status!=='CREADO'||t.origin!==loc||t.id===ignoreTransfer)continue;for(const it of t.items)if(it.sku===sku)count+=it.qty}return count}
function ownReservation(o,sku){return o.status==='RESERVADO'?o.items.filter(x=>x.sku===sku).reduce((a,x)=>a+x.qty,0):0}
function fulfillment(o){return o.fulfillment||(o.tripId?'FLOTA':o.type==='VENTA_DIRECTA'?'RETIRO':'EXTERNO')}
function orderLabel(o){return o.status==='RESERVADO'?(o.tripId?'PROGRAMADO':'POR PROGRAMAR'):o.status==='DESPACHADO'?'EN ENTREGA':o.status}
function tripOrders(t){return data.orders.filter(o=>o.tripId===t.id)}
function totalOrderUnits(o){return o.items.reduce((n,it)=>n+it.qty,0)}
function tripUnitCount(t){return tripOrders(t).reduce((n,o)=>n+totalOrderUnits(o),0)}

function orderTotalValue(o){const v=Number(o.totalAmount);return o.totalAmount!==null&&o.totalAmount!==undefined&&o.totalAmount!==''&&Number.isFinite(v)&&v>0?v:null}
function orderPaidValue(o){const v=Number(o.paidAmount||0);return Number.isFinite(v)&&v>0?v:0}
function orderPaymentStatus(o){const total=orderTotalValue(o);if(total===null)return 'VALOR PENDIENTE';if(orderPaidValue(o)>=total)return 'PAGADO';return orderPaidValue(o)>0?'PAGO PARCIAL':'NO PAGADO'}
function orderInvoiceStatus(o){return o.invoiceRequired===true?(o.invoiceIssued?'EMITIDA':'POR FACTURAR'):o.invoiceRequired===false?'NO REQUIERE':'POR CONFIRMAR'}
function commercialFields(o=null){
 const req=o?.invoiceRequired===true?'SI':o?.invoiceRequired===false?'NO':'POR_CONFIRMAR';
 return `<label>Valor total del pedido (COP)<input name="totalAmount" type="number" min="1" step="1" placeholder="Definir después" value="${esc(o?.totalAmount??'')}"></label><label>Abono recibido (COP)<input name="paidAmount" type="number" min="0" step="1" value="${esc(o?.paidAmount??0)}"></label><label>¿Requiere factura?<select name="invoiceRequired"><option value="POR_CONFIRMAR" ${req==='POR_CONFIRMAR'?'selected':''}>Por confirmar</option><option value="SI" ${req==='SI'?'selected':''}>Sí</option><option value="NO" ${req==='NO'?'selected':''}>No</option></select></label>${o?`<label>Factura emitida<select name="invoiceIssued"><option value="NO" ${!o.invoiceIssued?'selected':''}>Pendiente</option><option value="SI" ${o.invoiceIssued?'selected':''}>Sí, emitida</option></select></label><label class="full">Número de factura (si está emitida)<input name="invoiceNumber" placeholder="FAC-001" value="${esc(o.invoiceNumber??'')}"></label>`:''}`;
}
function validatedCommercial(f){
 const raw=String(f.get('totalAmount')??'').trim(),totalAmount=raw===''?null:Number(raw),paidAmount=Number(f.get('paidAmount')||0);
 if(totalAmount!==null&&(!Number.isSafeInteger(totalAmount)||totalAmount<=0))throw Error('El valor del pedido debe ser un entero positivo.');
 if(!Number.isSafeInteger(paidAmount)||paidAmount<0)throw Error('El valor recibido debe ser un entero válido.');
 if(paidAmount>0&&totalAmount===null)throw Error('Define el valor del pedido antes de registrar abonos.');
 if(totalAmount!==null&&paidAmount>totalAmount)throw Error('El abono no puede superar el total del pedido.');
 const rawInvoice=String(f.get('invoiceRequired')||'POR_CONFIRMAR');
 if(!['SI','NO','POR_CONFIRMAR'].includes(rawInvoice))throw Error('Indica si se requiere factura.');
 const invoiceRequired=rawInvoice==='SI'?true:rawInvoice==='NO'?false:null;
 const invoiceIssued=invoiceRequired===true&&f.get('invoiceIssued')==='SI';
 const invoiceNumber=invoiceIssued?String(f.get('invoiceNumber')||'').trim():null;
 if(invoiceIssued&&!invoiceNumber)throw Error('Falta el número de la factura emitida.');
 return {totalAmount,paidAmount,invoiceRequired,invoiceIssued,invoiceNumber};
}

function transaction(mutator){const prior=data,draft=JSON.parse(JSON.stringify(data));mutator(draft);const after=balancesAt(draft);for(const [sku,b] of Object.entries(after)){for(const loc of ['M','P','T'])if(b[loc]<0)throw Error(`Inventario negativo para ${sku} en ${LOC[loc]}.`);for(const loc of ['M','P'])if(b[loc]-reservedFor(draft,sku,loc)<0)throw Error(`Reservas superan existencias de ${sku} en ${LOC[loc]}.`)}data=draft;if(!persist()){data=prior;throw Error('No fue posible almacenar la operación en el navegador. Libera espacio o reinicia la demo.')}}
function nextId(d,prefix){return `${prefix}-${d.seq++}`}

function calcCurrent(){return balancesAt(data)}
function inventorySummary(balances=calcCurrent()){let physical=0,m=0,p=0,t=0,availableTotal=0,reserved=0;for(const pdt of data.products){const b=balances[pdt.sku]||{M:0,P:0,T:0};m+=b.M;p+=b.P;t+=b.T;physical+=b.M+b.P+b.T;for(const l of ['M','P']){const r=reservedFor(data,pdt.sku,l);reserved+=r;availableTotal+=b[l]-r}}return {physical,m,p,t,reserved,availableTotal}}
function getDaily(start=data.start,end=data.end){const arr=[];for(let dt=start;dt<=end;dt=plusDays(dt,1)){arr.push({date:dt,produced:0,dispatched:0,transfer:0,received:0,adjusted:0,expenses:0,deliveries:0,trips:0,moves:0})}const map=Object.fromEntries(arr.map(x=>[x.date,x]));for(const e of data.events){const x=map[e.date];if(!x)continue;x.moves++;if(e.kind==='PRODUCCION')x.produced+=e.qty;if(e.kind==='DESPACHO'||e.kind==='VENTA')x.dispatched+=e.qty;if(e.kind==='TRASLADO_SALIDA')x.transfer+=e.qty;if(e.kind==='TRASLADO_RECEPCION')x.received+=e.qty;if(e.kind==='AJUSTE')x.adjusted+=e.legs.reduce((n,y)=>n+y.delta,0)}for(const ex of data.expenses){if(map[ex.date])map[ex.date].expenses+=ex.amount}for(const tr of data.trips){if(map[tr.date])map[tr.date].trips++}for(const o of data.orders){if(o.deliveredDate&&map[o.deliveredDate]&&o.type==='DESPACHO')map[o.deliveredDate].deliveries++}return arr}

function periodProductions(){return data.productions.filter(x=>x.date>=ui.analyticsStart&&x.date<=ui.analyticsEnd&&(ui.analyticsSku==='ALL'||x.sku===ui.analyticsSku)&&(ui.analyticsLoc==='ALL'||ui.analyticsLoc==='M'))}
function periodTransfers(){return data.transfers.filter(x=>x.date>=ui.analyticsStart&&x.date<=ui.analyticsEnd&&(ui.analyticsSku==='ALL'||x.items.some(it=>it.sku===ui.analyticsSku))&&(ui.analyticsLoc==='ALL'||ui.analyticsLoc===x.origin||ui.analyticsLoc===x.destination||ui.analyticsLoc==='T'))}

function svgBar(arr, keys=[{key:'produced',label:'Producción',color:'#19a58e'},{key:'dispatched',label:'Salidas',color:'#468dbc'}],size='normal'){
 if(!arr.length)return '<div class="empty">Sin datos en el periodo seleccionado.</div>';
 const width=720,height=size==='mini'?180:230,left=37,right=9,top=15,bottom=34,h=height-top-bottom,ww=width-left-right;
 const max=Math.max(1,...arr.map(x=>keys.reduce((m,k)=>Math.max(m,+x[k.key]||0),0)));const rounded=Math.ceil(max/4/10)*10||10;const maxTick=rounded*4;
 let svg=`<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Comparación diaria">`;
 for(let n=0;n<=4;n++){const y=top+h-(n/4)*h;svg+=`<line x1="${left}" x2="${width-right}" y1="${y}" y2="${y}" stroke="#eaf0f3"/><text x="${left-7}" y="${y+3}" text-anchor="end" class="chart-label">${fmt(maxTick*n/4)}</text>`}
 const dayW=ww/arr.length,groupW=Math.min(33,dayW*.7),w=groupW/keys.length;
 arr.forEach((d,i)=>{keys.forEach((k,j)=>{const v=Math.max(0,+d[k.key]||0),bh=(v/maxTick)*h,x=left+i*dayW+(dayW-groupW)/2+j*w;svg+=`<rect x="${x.toFixed(2)}" y="${(top+h-bh).toFixed(2)}" width="${Math.max(2,w-1.5).toFixed(2)}" height="${Math.max(0,bh).toFixed(2)}" rx="2" fill="${k.color}"><title>${esc(shortDate(d.date))} · ${esc(k.label)}: ${fmt(v)}</title></rect>`});if(arr.length<=16||i%Math.ceil(arr.length/12)===0)svg+=`<text class="chart-label" x="${(left+i*dayW+dayW/2).toFixed(1)}" y="${height-10}" text-anchor="middle">${d.date.slice(8)}</text>`});svg+='</svg>';return `<div class="chart-wrap">${svg}<div class="legend">${keys.map(x=>`<span><b style="background:${x.color}"></b>${x.label}</span>`).join('')}</div></div>`
}
function svgLine(arr,key,label='#158d82'){
 if(!arr.length)return '<div class="empty">Sin datos.</div>';const width=720,height=190,left=54,right=15,top=16,bottom=29,h=height-top-bottom,w=width-left-right;
 const minActual=Math.min(...arr.map(x=>x[key]||0)),maxActual=Math.max(...arr.map(x=>x[key]||0)),range=Math.max(1,maxActual-minActual),min=Math.max(0,Math.floor((minActual-range*.18)/25)*25),max=Math.ceil((maxActual+range*.18)/25)*25,span=Math.max(1,max-min);
 let str=`<svg viewBox="0 0 ${width} ${height}" aria-label="Evolución diaria">`;
 for(let i=0;i<4;i++){const y=top+i*h/3;str+=`<line x1="${left}" x2="${width-right}" y1="${y}" y2="${y}" stroke="#eef2f5"/><text x="${left-8}" y="${y+3}" text-anchor="end" class="chart-label">${fmt(Math.round(max-i*span/3))}</text>`}
 const path=arr.map((x,i)=>`${i?'L':'M'}${left+(i/(arr.length-1||1))*w},${top+h-((x[key]-min)/span)*h}`).join(' ');
 str+=`<path d="${path}" fill="none" stroke="${label}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
 arr.forEach((x,i)=>{const xx=left+(i/(arr.length-1||1))*w,yy=top+h-((x[key]-min)/span)*h;str+=`<circle cx="${xx}" cy="${yy}" r="3.1" fill="white" stroke="${label}" stroke-width="2"><title>${shortDate(x.date)}: ${fmt(x[key])}</title></circle>`;if(arr.length<=16||i%Math.ceil(arr.length/13)===0)str+=`<text x="${xx}" y="${height-7}" text-anchor="middle" class="chart-label">${x.date.slice(8)}</text>`});str+='</svg>';return str}

function orderRows(){return data.orders.filter(o=>(!ui.search||`${o.id} ${o.customer} ${o.items.map(x=>x.sku).join(' ')}`.toLowerCase().includes(ui.search.toLowerCase()))&&(!ui.orderStatus||ui.orderStatus==='ALL'||o.status===ui.orderStatus)).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,120).map(o=>{const acts=[];const mode=fulfillment(o);if(o.status==='RESERVADO'&&mode==='FLOTA'&&!o.tripId&&can('dispatch'))acts.push(btn('Programar camión','assignOrder',o.id,'primary'));if(o.status==='RESERVADO'&&mode==='EXTERNO'&&can('dispatch'))acts.push(btn('Despachar externo','dispatchOrder',o.id,'primary'));if(o.status==='RESERVADO'&&can('dispatch'))acts.push(btn('Cancelar','cancelOrder',o.id));if(o.status==='RESERVADO'&&o.tripId)acts.push('<span class="sub">Esperando carga del viaje</span>');if(o.status==='DESPACHADO'&&mode==='EXTERNO'&&can('deliver'))acts.push(btn('Confirmar entrega','deliverOrder',o.id,'primary'));if(o.status==='DESPACHADO'&&mode==='FLOTA')acts.push('<span class="sub">Se confirma al cerrar la ruta</span>');if(o.status==='NO ENTREGADO'&&can('returnOrder')&&canReturnOrder(o))acts.push(btn('Registrar devolución','returnOrder',o.id,'primary'));if(o.status==='ENTREGADO'&&mode==='FLOTA'&&!hasProofFile(o)&&can('deliver'))acts.push(btn('Subir remisión','proofOrder',o.id,'primary'));if(can('commercial'))acts.push(btn('Cobro / factura','commercialOrder',o.id));return `<tr><td><strong>${o.id}</strong><div class="sub">${shortDate(o.date)}</div></td><td>${esc(o.customer)}<div class="sub">${mode==='RETIRO'?'Retira cliente':mode==='FLOTA'?'Entrega en camión propio':'Transporte externo'}</div></td><td>${LOC[o.origin]}</td><td>${o.items.map(it=>`${esc(it.sku)} (${it.qty})`).join('<br>')}</td><td><strong>${fmt(totalOrderUnits(o))}</strong></td><td>${badge(orderLabel(o))}</td><td>${esc(o.tripId||'—')}</td><td>${mode==='FLOTA'?proofTag(o):'—'}</td><td>${badge(orderPaymentStatus(o))}<div class="sub">${money(orderPaidValue(o))} / ${orderTotalValue(o)===null?'sin valor':money(orderTotalValue(o))}</div></td><td>${badge(orderInvoiceStatus(o))}${o.invoiceNumber?`<div class="sub">${esc(o.invoiceNumber)}</div>`:''}</td><td><div class="flex">${acts.join('')||'—'}</div></td></tr>`}).join('')||'<tr><td colspan="11" class="empty">Sin pedidos para este filtro.</td></tr>'}
function fleetPage(){
 const exps=data.expenses,cost=exps.reduce((n,x)=>n+x.amount,0),closed=data.trips.filter(t=>t.status==='CERRADO');

function expenseDonut(expenses){const items=Object.entries(expenses.reduce((o,e)=>(o[e.type]=(o[e.type]||0)+e.amount,o),{})).sort((a,b)=>b[1]-a[1]),sum=items.reduce((n,x)=>n+x[1],0)||1;let pos=0;const stops=items.map(([k,v])=>{const start=pos;pos+=v/sum*100;return `${COLOR[k]||'#999'} ${start.toFixed(2)}% ${pos.toFixed(2)}%`}).join(',');return `<div style="display:grid;grid-template-columns:.8fr 1.3fr;align-items:center;gap:12px"><div class="chart-donut" style="background:conic-gradient(${stops||'#eee 0 100%'})"><div class="hole"><strong>${money(sum)}</strong><small>Gasto total</small></div></div><div class="split-list">${items.map(([k,v])=>`<div class="split-row"><span><i style="background:${COLOR[k]||'#aaa'}"></i>${esc(k)}</span><strong>${money(v)} <span class="sub">${(v/sum*100).toFixed(0)}%</span></strong></div>`).join('')}</div></div>`}
function rankingProducts(events,n){const by={};for(const e of events)by[e.sku]=(by[e.sku]||0)+e.qty;const items=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,n),max=Math.max(1,...items.map(x=>x[1]));return items.map(([sku,q])=>`<div class="hbar-row"><span>${esc(pOf(sku)?.name||sku)}<br><small class="sub">${esc(pOf(sku)?.color||'')}</small></span><div class="hbar"><i style="width:${q/max*100}%"></i></div><strong>${fmt(q)}</strong></div>`).join('')||'<div class="empty">No hay datos.</div>'}
function analyticsPage(){const ev=periodEvents(),prod=ev.filter(x=>x.kind==='PRODUCCION').reduce((n,x)=>n+x.qty,0),out=ev.filter(x=>x.kind==='DESPACHO'||x.kind==='VENTA').reduce((n,x)=>n+x.qty,0),sent=ev.filter(x=>x.kind==='TRASLADO_SALIDA').reduce((n,x)=>n+x.qty,0),received=ev.filter(x=>x.kind==='TRASLADO_RECEPCION').reduce((n,x)=>n+x.qty,0),trips=periodTrips(),expenses=periodExpenses(),cost=expenses.reduce((n,x)=>n+x.amount,0),delivered=periodOrders().filter(o=>o.status==='ENTREGADO'&&o.type==='DESPACHO').length,closing=balancesAt(data,ui.analyticsEnd),skuList=ui.analyticsSku==='ALL'?data.products:[pOf(ui.analyticsSku)].filter(Boolean);let invStart=0,invEnd=0;skuList.forEach(p=>{for(const l of (ui.analyticsLoc==='ALL'?['M','P','T']:[ui.analyticsLoc])){invStart+=balanceFor(data,p.sku,l,plusDays(ui.analyticsStart,-1));invEnd+=closing[p.sku]?.[l]||0}});const days=getDaily(ui.analyticsStart,ui.analyticsEnd);const byDay=days.map(d=>{let e=ev.filter(x=>x.date===d.date);return {...d,produced:e.filter(x=>x.kind==='PRODUCCION').reduce((n,x)=>n+x.qty,0),dispatched:e.filter(x=>x.kind==='DESPACHO'||x.kind==='VENTA').reduce((n,x)=>n+x.qty,0),transfer:e.filter(x=>x.kind==='TRASLADO_SALIDA').reduce((n,x)=>n+x.qty,0)}});let running=invStart;const timeline=days.map(x=>{const net=ev.filter(e=>e.date===x.date).reduce((n,e)=>n+e.legs.filter(l=>ui.analyticsLoc==='ALL'||l.loc===ui.analyticsLoc).reduce((m,l)=>m+l.delta,0),0);running+=net;return {date:x.date,stock:running}});
 const closedTrips=trips.filter(t=>t.status==='CERRADO'),closedDeliveries=closedTrips.reduce((n,t)=>n+data.orders.filter(o=>o.tripId===t.id&&o.status==='ENTREGADO').length,0),closedCost=expenses.filter(e=>closedTrips.some(t=>t.id===e.tripId)).reduce((n,e)=>n+e.amount,0),closedUnits=closedTrips.reduce((n,t)=>n+tripUnitCount(t),0),proofed=closedTrips.reduce((n,t)=>n+tripOrders(t).filter(o=>hasProofFile(o)).length,0),closedTransfers=closedTrips.reduce((n,t)=>n+data.transfers.filter(x=>x.tripId===t.id).length,0);
 return `${intro('Panel analítico de operación','Todas las cifras se calculan desde movimientos, pedidos, traslados, viajes y gastos.',`<button class="btn secondary" data-action="print">▤ Imprimir reporte</button>`)}<div class="card compact"><div class="toolbar"><div class="field"><label>Desde</label><input type="date" data-filter="analyticsStart" value="${ui.analyticsStart}" min="${data.start}" max="${data.end}"></div><div class="field"><label>Hasta</label><input type="date" data-filter="analyticsEnd" value="${ui.analyticsEnd}" min="${data.start}" max="${data.end}"></div><div class="field"><label>Ubicación inventario</label><select data-filter="analyticsLoc"><option value="ALL">Todas las ubicaciones</option>${Object.entries(LOC).map(([k,v])=>`<option value="${k}" ${ui.analyticsLoc===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Referencia</label><select data-filter="analyticsSku"><option value="ALL">Todas las referencias</option>${data.products.map(p=>`<option value="${esc(p.sku)}" ${ui.analyticsSku===p.sku?'selected':''}>${esc(p.sku)}</option>`).join('')}</select></div><div class="field"><label>Atajos</label><div class="flex">${btn('15 días','analyticsRange','15')}${btn('7 días','analyticsRange','7')}${btn('Hoy','analyticsRange','1')}</div></div></div></div><div class="grid kpis">${K('Producción periodo',fmt(prod),'Unidades aprobadas','⚙')}${K('Salidas periodo',fmt(out),'Ventas + despachos','↗','blue')}${K('Traslados despachados',fmt(sent),`${fmt(received)} und. recibidas`,'⇄','amber')}${K('Movimientos Kardex',fmt(ev.length),'Líneas registradas','▦')}${K('Inventario al inicio',fmt(invStart),'Inicio del filtro','▥','blue')}${K('Inventario al final',fmt(invEnd),'Cierre del día seleccionado','▤')}${K('Gastos de camión',money(cost),'Viajes + generales','＄','red')}${K('Viajes programados',fmt(trips.length),`${delivered} entregas completas`,'▰','amber')}</div><div class="cols-2">${card('Producción vs. despachos','Unidades registradas por jornada',svgBar(byDay))}${card('Movimiento de existencias','Saldo total al cierre de cada día seleccionado',svgLine(timeline,'stock')+`<div class="legend"><span><b style="background:#158d82"></b>Inventario · ${ui.analyticsLoc==='ALL'?'Todas':LOC[ui.analyticsLoc]}</span></div>`)}</div><div class="cols-2">${card('Flujo de transferencias','Salidas entre sedes, por día',svgBar(byDay,[{key:'transfer',label:'Unidades en traslado',color:'#4384b9'}],'mini'))}${card('Gastos de transporte · periodo','Distribución por concepto',expenseDonut(expenses))}</div><div class="cols-2">${card('Productividad del camión','Indicadores calculados para el periodo seleccionado.',`<div class="metric-grid"><div class="metric"><small>Rutas cerradas</small><strong>${fmt(closedTrips.length)}</strong></div><div class="metric"><small>Traslados con camión</small><strong>${fmt(closedTransfers)}</strong></div><div class="metric"><small>Costo por entrega</small><strong>${closedDeliveries?money(closedCost/closedDeliveries):'—'}</strong></div><div class="metric"><small>Entregas por viaje</small><strong>${closedTrips.length?(closedDeliveries/closedTrips.length).toFixed(1):'—'}</strong></div></div><div class="callout">Camión: ${fmt(closedUnits)} unidades movilizadas; ${proofed}/${closedDeliveries} entregas con remisión adjunta. El costo por entrega solo considera viajes cerrados. Los filtros de SKU y sede aplican al inventario; los costos de rutas completas se filtran por fechas.</div>`)}${card('Referencias más fabricadas','Top de entradas de producción dentro del filtro',rankingProducts(ev.filter(e=>e.kind==='PRODUCCION'),6))}</div><div class="cols-2">${card('Resumen del flujo operativo','Desglose de resultados del periodo',`<div class="status-row"><span>Unidades producidas</span><strong class="delta pos">+${fmt(prod)}</strong></div><div class="status-row"><span>Unidades despachadas/vendidas</span><strong class="delta neg">−${fmt(out)}</strong></div><div class="status-row"><span>Traslados enviados (e  else if(a==='assignTransfer'){if(!can('transfer'))throw Error('Sin permiso.');const t=data.transfers.find(x=>x.id===id),trips=data.trips.filter(x=>x.status==='PROGRAMADO'&&x.origin===t?.origin);if(!t||t.status!=='CREADO'||t.transport!=='FLOTA'||t.tripId)throw Error('El traslado debe estar creado para el camión propio.');return modal('Vincular traslado al camión',`${t.id} · carga en ${LOC[t.origin]} · entrega en ${LOC[t.destination]}`,`<div class="form-grid"><label class="full">Viaje programado<select name="tripId"><option value="NEW">+ Crear nuevo viaje desde ${LOC[t.origin]}</option>${trips.map(x=>`<option value="${x.id}">${x.id} · ${esc(x.route)}</option>`).join('')}</select></label><label class="full">Ruta para viaje nuevo<input name="route" value="${LOC[t.origin]} → ${LOC[t.destination]}" required></label><label>Conductor para viaje nuevo<input name="driver" value="Carlos Rojas" required></label><input name="transferId" type="hidden" value="${t.id}"><div class="full info-strip">Las unidades estarán reservadas hasta iniciar la ruta. Al salir pasan a tránsito y en destino se confirma la recepción.</div></div>`,'Asignar traslado','assignTransfer')}
 else if(a==='startTrip'){if(!can('startTrip'))throw Error('Solo conductor o administrador puede iniciar viaje.');transaction(d=>{const t=d.trips.find(x=>x.id===id);if(!t||t.status!=='PROGRAMADO')throw Error('Este viaje ya fue iniciado o cerrado.');const assigned=d.orders.filter(o=>o.tripId===t.id);const assignedTransfers=d.transfers.filter(x=>x.tripId===t.id);if(!assigned.length&&!assignedTransfers.length)throw Error('Primero asigna una venta o traslado a este viaje.');for(const o of assigned){if(o.origin!==t.origin||o.status!=='RESERVADO'||fulfillment(o)!=='FLOTA')throw Error('Un pedido no corresponde a la sede de recogida.');for(const it of o.items)if(balanceFor(d,it.sku,o.origin)<it.qty)throw Error('No hay inventario para cargar '+it.sku)}for(const o of assigned){for(const it of o.items)appendEvent(d,{date,kind:'DESPACHO',sku:it.sku,legs:[{loc:o.origin,delta:-it.qty}],ref:o.id,desc:'Cargado al camión '+t.id});o.status='DESPACHADO';o.pickupDate=date}for(const tr of assignedTransfers){if(tr.status==='CREADO'){for(const it of tr.items){if(balanceFor(d,it.sku,tr.origin)-reservedFor(d,it.sku,tr.origin,tr.id)<it.qty)throw Error('Inventario insuficiente para traslado.')}for(const it of tr.items)appendEvent(d,{date,kind:'TRASLADO_SALIDA',sku:it.sku,legs:[{loc:tr.origin,delta:-it.qty},{loc:'T',delta:it.qty}],ref:tr.id,desc:'Traslado cargado en '+t.id});tr.status='EN TRÁNSITO';tr.sentDate=date}}t.status='EN RUTA';t.startDate=date})}
 else if(a==='proofOrder'){const o=data.orders.find(x=>x.id===id);if(!o||o.status!=='ENTREGADO'||fulfillment(o)!=='FLOTA'||!can('deliver'))throw Error('Primero debe figurar como entregada.');return modal('Adjuntar remisión de entrega',`${o.id} · ${esc(o.customer)} · viaje ${esc(o.tripId)}`,`<div class="form-grid"><label class="full">Número de remisión<input name="remisionNumber" placeholder="REM-2026-001" required></label><label class="full">Archivo PDF, JPG o PNG<input type="file" name="remisionFile" accept="application/pdf,image/jpeg,image/png" required></label><input type="hidden" name="orderId" value="${esc(o.id)}"><div class="full info-strip">Archivo independiente por pedido. Guardado únicamente en este navegador mediante IndexedDB, no se sube a Google Drive. Máximo 3 MB por archivo.</div></div>`,'Adjuntar remisión','proofOrder')}
 else if(a==='viewProof'){const o=data.orders.find(x=>x.id===id);if(!o?.remision?.blobKey)throw Error('No hay archivo adjunto real en esta demostración.');openStoredProof(o.remision.blobKey);return}
 else if(a==='closeTrip'){
  const t=data.trips.find(x=>x.id===id);if(!t||!can('closeTrip')||!tripCanClose(t))throw Error('La ruta no está disponible para cierre.');
  const orders=tripOrders(t),transfers=data.transfers.filter(x=>x.tripId===t.id);
  const rows=orders.map(o=>`<div class="batch-delivery"><div class="batch-head"><label class="batch-check"><input type="checkbox" name="delivered_${esc(o.id)}" value="1" ${o.status==='DESPACHADO'?'checked':''} ${o.status==='ENTREGADO'?'checked disabled':''}> <strong>${esc(o.id)} · ${esc(o.customer)}</strong></label><span>${fmt(totalOrderUnits(o))} und. · ${badge(o.status)}</span></div><details><summary>Remisión individual (opcional al cerrar)</summary><div class="form-grid"><label>Número de remisión<input name="proofNumber_${esc(o.id)}" placeholder="REM-${esc(o.id)}" value="${esc(o.remision?.number||'')}"></label><label>Adjuntar PDF, JPG o PNG<input type="file" name="proofFile_${esc(o.id)}" accept="application/pdf,image/jpeg,image/png"></label></div></details></div>`).join('');
  return modal('Cierre masivo de la ruta',`${esc(t.id)} · ${orders.length} entregas independientes · ${transfers.length} traslado(s)`,
  `<div class="info-strip"><strong>Una sola confirmación.</strong> Se marcan como entregados todos los pedidos seleccionados; desmarca solo los no entregados. No se vuelve a descontar inventario. Puedes adjuntar una remisión por pedido ahora o posteriormente.</div>
   <div class="batch-actions"><button type="button" class="btn secondary tiny" data-action="batchAll">✓ Seleccionar todos</button><button type="button" class="btn secondary tiny" data-action="batchNone">Desmarcar pendientes</button></div>
   <div class="batch-list">${rows||'<div class="empty">Solo traslados internos.</div>'}</div>
   <div class="info-strip">${transfers.length} traslado(s) del camión pasarán a <b>TRASLADADO</b>; la bodega de destino confirmará la recepción por separado. Las entregas no realizadas quedarán <b>NO ENTREGADO</b> para gestionar devolución.</div>
   <input type="hidden" name="tripId" value="${esc(t.id)}">`, 'Cerrar toda la ruta','closeTrip')
 }

 else return;
 if(el('#modal').open)el('#modal').close();showToast('Movimiento aplicado; inventario y reportes actualizados.');render();
 }catch(e){showToast(e.message||String(e),true)}}
let eventTarget=null;
function render(){if(!ACCESS[data.profile].includes(ui.page))ui.page='inicio';el('#app').innerHTML=topShell();const funcs={inicio:overview,analitica:analyticsPage,produccion:productionPage,inventario:inventoryPage,traslados:transferPage,pedidos:ordersPage,flota:fleetPage,catalogo:catalogPage};el('#page').innerHTML=(funcs[ui.page]||overview)()}
function refreshTable(){const map={inventario:['inventoryRows','inventoryRows'],catalogo:['catalogRows','catalogRows'],produccion:['productionRows','productionRows'],traslados:['transferRows','transferRows'],pedidos:['orderRows','orderRows']};const val=map[ui.page];if(!val)return;const target=el('#'+val[0]);if(target)target.innerHTML=({inventoryRows,catalogRows,productionRows,transferRows,orderRows})[val[1]]()}
document.addEventListener('click',e=>{eventTarget=e.target;const b=e.target.closest('[data-nav],[data-action],[data-tab]');if(!b)return;if(b.dataset.nav){pageNav(b.dataset.nav);return}if(b.dataset.tab){ui.expenseTab=b.dataset.tab;render();return}if(b.dataset.action==='analyticsRange'){const n=Number(b.dataset.id);ui.analyticsStart=plusDays(data.end,-(n-1));ui.analyticsEnd=data.end;render();return}handleAction(b.dataset.action,b.dataset.id)});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='profile'){data.profile=t.value;persist();if(!ACCESS[data.profile].includes(ui.page))ui.page='inicio';render();return}if(t.id==='historicDate'){ui.inventoryDate=t.value;if(ui.selectedProduct)detailProduct(ui.selectedProduct);return}if(!t.dataset.filter)return;ui[t.dataset.filter]=t.value;if(t.dataset.filter==='analyticsStart'||t.dataset.filter==='analyticsEnd'){if(ui.analyticsStart>ui.analyticsEnd){showToast('La fecha inicial no puede superar la final.',true);if(t.dataset.filter==='analyticsStart')ui.analyticsEnd=ui.analyticsStart;else ui.analyticsStart=ui.analyticsEnd}render()}else if(t.dataset.filter.startsWith('analytics'))render();else refreshTable()});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.filter==='search'){ui.search=t.value;refreshTable()}});
// Las remisiones del prototipo viven en IndexedDB, no en localStorage; soporta muchas entregas.
function proofDatabase(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(Error('Tu navegador no admite archivos locales; abre la demo en Chrome o Edge.'));const r=indexedDB.open('PlastiControl_V4_Remisiones',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(Error('No es posible abrir el almacén local de remisiones.'))})}
async function readProof(file){if(!file||!file.size)return null;const mime=file.type||'';if(!['application/pdf','image/jpeg','image/png'].includes(mime))throw Error('La remisión debe ser PDF, JPG o PNG.');if(file.size>3*1024*1024)throw Error('Cada remisión puede tener hasta 3 MB.');const db=await proofDatabase(),blobKey='R-'+Date.now()+'-'+Math.random().toString(36).slice(2);await new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(file,blobKey);tx.oncomplete=resolve;tx.onerror=()=>reject(Error('No fue posible guardar el archivo en el navegador.'))});db.close();return {blobKey,fileName:file.name,mime,date:localDate(),demo:false}}
async function openStoredProof(key){try{const db=await proofDatabase(),file=await new Promise((resolve,reject)=>{const r=db.transaction('files','readonly').objectStore('files').get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(Error('No se encontró el archivo.'))});db.close();if(!file)throw Error('La remisión ya no está disponible en este navegador.');const link=URL.createObjectURL(file);const a=document.createElement('a');a.href=link;a.target='_blank';a.rel='noopener';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(link),60000)}catch(e){showToast(e.message||String(e),true)}}

document.addEventListener('submit',async e=>{const form=e.target;if(form.id!=='modalForm')return;e.preventDefault();const kind=form.dataset.submit,f=new FormData(form);const submitButton=form.querySelector('button[type="submit"]');if(submitButton)submitButton.disabled=true;try{
 if(kind==='assignOrder'){transaction(d=>{const o=d.orders.find(x=>x.id===f.get('orderId'));if(!o||o.status!=='RESERVADO'||o.tripId||fulfillment(o)!=='FLOTA'||!can('dispatch'))throw Error('Pedido ya programado o no disponible.');let t;if(f.get('tripId')==='NEW'){const route=String(f.get('route')||'').trim(),driver=String(f.get('driver')||'').trim();if(!route||!driver)throw Error('Completa conductor y ruta.');const id=nextId(d,'VIA');t={id,date:localDate(),vehicle:'Camión de reparto · PLT-214',driver,origin:o.origin,route,status:'PROGRAMADO',orderIds:[],transferIds:[],closeDate:null};d.trips.push(t)}else{t=d.trips.find(x=>x.id===f.get('tripId'));if(!t||t.status!=='PROGRAMADO'||t.origin!==o.origin)throw Error('El viaje debe estar programado y recoger en '+LOC[o.origin])}o.tripId=t.id;t.orderIds.push(o.id)});el('#modal').close();render();showToast('Venta programada en viaje. Inicia el viaje desde Flota para cargar mercancía.');return}
 if(kind==='assignTransfer'){transaction(d=>{const transfer=d.transfers.find(t=>t.id===f.get('transferId'));if(!transfer||transfer.status!=='CREADO'||transfer.transport!=='FLOTA'||transfer.tripId||!can('transfer'))throw Error('Traslado no disponible.');let trip;if(f.get('tripId')==='NEW'){const route=String(f.get('route')||'').trim(),driver=String(f.get('driver')||'').trim();if(!route||!driver)throw Error('Completa conductor y ruta.');trip={id:nextId(d,'VIA'),date:localDate(),vehicle:'Camión de reparto · PLT-214',driver,origin:transfer.origin,route,status:'PROGRAMADO',orderIds:[],transferIds:[],closeDate:null};d.trips.push(trip)}else trip=d.trips.find(t=>t.id===f.get('tripId'));if(!trip||trip.status!=='PROGRAMADO'||trip.origin!==transfer.origin)throw Error('El camión debe recoger en la sede de origen.');transfer.tripId=trip.id;if(!trip.transferIds.includes(transfer.id))trip.transferIds.push(transfer.id)});el('#modal').close();render();showToast('Traslado vinculado al viaje.');return}
 if(kind==='proofOrder'){const proof=await readProof(f.get('remisionFile'));const number=String(f.get('remisionNumber')||'').trim();if(!number||!proof)throw Error('Ingresa número y adjunta el archivo.');transaction(d=>{const o=d.orders.find(x=>x.id===f.get('orderId'));if(!o||o.status!=='ENTREGADO'||!o.tripId||!can('deliver'))throw Error('Entrega no disponible.');o.remision={number,...proof}});el('#modal').close();render();showToast('Remisión asociada a la entrega y al viaje.');return}
 if(kind==='closeTrip'){
  const t=data.trips.find(x=>x.id===f.get('tripId'));if(!t||!can('closeTrip')||!tripCanClose(t))throw Error('La ruta cambió de estado.');
  const proofs={};for(const o of tripOrders(t)){
    const file=f.get('proofFile_'+o.id),number=String(f.get('proofNumber_'+o.id)||'').trim();
    const attachment=await readProof(file);
    if(attachment)proofs[o.id]={number:number||'REM-'+o.id,...attachment};
    else if(number&&!orderRemision(o))proofs[o.id]={number,fileName:null,blobKey:null,date:localDate(),demo:false};
  }
  transaction(d=>{const tr=d.trips.find(x=>x.id===t.id);if(!tr||tr.status!=='EN RUTA')throw Error('Viaje ya cerrado.');
    for(const o of d.orders.filter(x=>x.tripId===tr.id)){
      if(o.status==='DESPACHADO'){
        if(f.get('delivered_'+o.id)==='1'){o.status='ENTREGADO';o.deliveredDate=localDate()}
        else{o.status='NO ENTREGADO';o.failedDate=localDate()}
      }
      if(proofs[o.id])o.remision=proofs[o.id];
    }
    for(const trf of d.transfers.filter(x=>x.tripId===tr.id&&x.status==='EN TRÁNSITO')){
      trf.status='TRASLADADO';trf.transportDeliveredDate=localDate();
    }
    tr.status='CERRADO';tr.closeDate=localDate();
  });el('#modal').close();render();showToast('Ruta cerrada en una sola operación. Remisiones individuales disponibles.');return
 }

 formSubmit(kind,f,form)
 }catch(ex){showToast(ex.message||String(ex),true)}finally{if(submitButton&&submitButton.isConnected)submitButton.disabled=false}});

el('#modal').addEventListener('click',e=>{if(e.target===el('#modal'))el('#modal').close()});
window.addEventListener('error',e=>{showToast('Error de interfaz: '+e.message,true);console.error(e)});
persist();render();
})();
